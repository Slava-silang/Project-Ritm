[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "project-ritm"
version = "0.1.0"
description = "Личный планировщик задач и времени на PySide6 и QML"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
ritm = "ritm.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ritm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
